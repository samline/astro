name: Verify Impeccable beta
on:
  push:
    branches: [feat/impeccable-beta]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: astro-beta-verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.9.1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir website install --frozen-lockfile
      - run: pnpm --dir website exec playwright install --with-deps chromium
      - run: bun run verify
      - run: bun run site:verify
      - run: bun run --cwd website check:release
      - run: bun run kit:pack
